# Keeps the free-tier backend from sleeping.
#
# Render suspends a free web service after ~15 minutes without inbound traffic,
# and waking it again takes 30-60 seconds -- long enough that a visitor assumes
# the site is broken. A periodic request keeps the instance warm.
#
# Setup: add a repository variable named HEALTH_CHECK_URL pointing at the
# deployed liveness endpoint, e.g. https://<service>.onrender.com/health
# (Settings -> Secrets and variables -> Actions -> Variables). Until it is set
# this workflow no-ops instead of failing.
name: Keep backend awake

on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # can be several minutes late under load, so this leaves margin against the
    # 15-minute idle window.
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

# Never let a slow cold start overlap with the next scheduled run.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::HEALTH_CHECK_URL is not set yet - nothing to ping."
            exit 0
          fi

          # A sleeping instance can take up to a minute to answer, so allow a
          # generous per-request timeout and retry before declaring failure.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 "$HEALTH_URL" || echo "000")

            if [ "$code" = "200" ]; then
              echo "Awake - HTTP $code on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt returned HTTP $code."

            # Guarded with `if` rather than `&&`: steps run under `bash -e`, so a
            # false `&&` on the final attempt would abort before the error below.
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          echo "::error::$HEALTH_URL did not return 200 after 3 attempts."
          exit 1
